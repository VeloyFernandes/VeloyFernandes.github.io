<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Banner</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10273A; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .text {
    position: fixed; left: 30vw; top: 50%; transform: translateY(-50%);
    color: #E9EFF1; background: #10273A; padding: 1.2vw 1.6vw 1.2vw 1.4vw; border-radius: 0.6vw;
  }
  .text h1 { font: 800 2.9vw/1.05 "Archivo", Arial, sans-serif; font-stretch: 110%; letter-spacing: -0.02em; margin: 0 0 0.9vw; }
  .text p { font: 500 1.45vw/1.3 "IBM Plex Sans", Arial, sans-serif; margin: 0; color: #C9D6DC; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="text">
  <h1>CFD, process simulation<br>and AI for engineering</h1>
  <p>OpenFOAM, Aspen Plus, DWSIM &nbsp;|&nbsp; veloyfernandes.github.io</p>
</div>
<script>
(function () {
  var c = document.getElementById('c'), ctx = c.getContext('2d');
  var stops = [[42,111,176],[143,179,207],[217,210,200],[222,154,126],[196,71,45]];
  function colour(s) {
    var t = Math.max(0, Math.min(1, (s - 0.35) / 1.5)) * (stops.length - 1);
    var i = Math.min(stops.length - 2, Math.floor(t)), f = t - i, a = stops[i], b = stops[i + 1];
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
  }
  function draw() {
    var dpr = Math.max(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight;
    c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#10273A'; ctx.fillRect(0, 0, W, H);
    var cx = W * 0.84, cy = H * 0.5, a = W * 0.052, a2 = a * a;
    ctx.lineWidth = Math.max(1, W / 1100); ctx.lineCap = "round"; ctx.globalAlpha = 0.6;
    var gap = W / 150, step = 2;
    for (var y0 = gap / 2; y0 < H; y0 += gap) {
      var x = -5, y = y0;
      while (x < W + 5) {
        var dx = x - cx, dy = y - cy, r2 = dx * dx + dy * dy;
        if (r2 < a2) break;
        var r4 = r2 * r2, u = 1 - a2 * (dx * dx - dy * dy) / r4, v = -2 * a2 * dx * dy / r4;
        var nx = x + u * step, ny = y + v * step;
        ctx.strokeStyle = colour(Math.hypot(u, v));
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(nx, ny); ctx.stroke();
        x = nx; y = ny;
      }
    }
    ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(cx, cy, a - ctx.lineWidth, 0, Math.PI * 2); ctx.fillStyle = '#E9EFF1'; ctx.fill();
  }
  draw(); addEventListener('resize', draw);
})();
</script>
</body>
</html>
